name: Build and Deploy Food Receipt AI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/wilbert-william/technical-ai-engineer-test-shopee

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-backend:${{ github.sha }}
            ${{ env.IMAGE_BASE }}-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-frontend:${{ github.sha }}
            ${{ env.IMAGE_BASE }}-frontend:latest

  deploy:
    needs: build
    runs-on: [self-hosted, Linux, X64]
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare runtime environment
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          LANGFUSE_TRACING: ${{ secrets.LANGFUSE_TRACING }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
        run: |
          set -euo pipefail
          umask 077
          cat > "$GITHUB_WORKSPACE/.env.deploy" <<EOF
          OPENAI_API_KEY=${OPENAI_API_KEY}
          OPENAI_MODEL=${OPENAI_MODEL}
          DATABASE_URL=${DATABASE_URL}
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          QDRANT_API_KEY=${QDRANT_API_KEY}
          QDRANT_URL=http://qdrant:6333
          LANGFUSE_TRACING=${LANGFUSE_TRACING:-false}
          LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
          LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
          LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-https://jp.cloud.langfuse.com}
          BACKEND_URL=http://backend:8000
          IMAGE_TAG=${GITHUB_SHA}
          EOF

      - name: Deploy application
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker compose \
            --project-name food-receipt-ai \
            --env-file "$GITHUB_WORKSPACE/.env.deploy" \
            -f "$GITHUB_WORKSPACE/docker-compose.yml" \
            up -d --pull always --remove-orphans

      - name: Verify deployment
        run: |
          set -euo pipefail
          docker compose \
            --project-name food-receipt-ai \
            --env-file "$GITHUB_WORKSPACE/.env.deploy" \
            -f "$GITHUB_WORKSPACE/docker-compose.yml" \
            ps

          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8001/health >/dev/null; then
              echo "Backend health check passed"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Backend health check failed"
              docker logs --tail 100 receipt-backend
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent http://127.0.0.1:8501/_stcore/health

      - name: Remove temporary environment file
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/.env.deploy"
