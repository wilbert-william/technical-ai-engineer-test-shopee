name: Build and Deploy receipt AI (shopee test)

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: receipt-ai-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/wilbert-william/technical-ai-engineer-test-shopee

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            dockerfile: backend/Dockerfile
          - component: frontend
            dockerfile: frontend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-${{ matrix.component }}:${{ github.sha }}
            ${{ env.IMAGE_BASE }}-${{ matrix.component }}:latest
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, Linux, X64]
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare runtime environment
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          LANGFUSE_TRACING: ${{ secrets.LANGFUSE_TRACING }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
        run: |
          set -euo pipefail
          umask 077

          cat > "$GITHUB_WORKSPACE/.env.deploy" <<EOF
          OPENAI_API_KEY=${OPENAI_API_KEY}
          OPENAI_MODEL=${OPENAI_MODEL}
          DATABASE_URL=${DATABASE_URL}
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          QDRANT_API_KEY=${QDRANT_API_KEY}
          QDRANT_URL=http://qdrant:6333
          LANGFUSE_TRACING=${LANGFUSE_TRACING:-false}
          LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
          LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
          LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-https://jp.cloud.langfuse.com}
          BACKEND_URL=http://backend:8000
          IMAGE_TAG=${GITHUB_SHA}
          EOF

      - name: Deploy application
        run: |
          set -euo pipefail

          docker compose \
            --project-name food-receipt-ai \
            --env-file "$GITHUB_WORKSPACE/.env.deploy" \
            -f "$GITHUB_WORKSPACE/docker-compose.yml" \
            up -d --pull always --remove-orphans

      - name: Verify deployment
        run: |
          set -euo pipefail

          docker compose \
            --project-name food-receipt-ai \
            --env-file "$GITHUB_WORKSPACE/.env.deploy" \
            -f "$GITHUB_WORKSPACE/docker-compose.yml" \
            ps

          check_health() {
            local name="$1"
            local url="$2"

            echo "Waiting for ${name} health..."
            for attempt in $(seq 1 24); do
              if curl --fail --silent --output /dev/null --max-time 3 "$url"; then
                echo "${name} health check passed"
                return 0
              fi

              if [ "$attempt" -lt 24 ]; then
                sleep 5
              fi
            done

            echo "${name} health check failed"
            docker logs --tail 100 "receipt-${name}"
            return 1
          }

          check_health backend http://127.0.0.1:8001/health &
          backend_check=$!
          check_health frontend http://127.0.0.1:8501/_stcore/health &
          frontend_check=$!

          wait "$backend_check"
          wait "$frontend_check"

      - name: Remove temporary environment file
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/.env.deploy"
